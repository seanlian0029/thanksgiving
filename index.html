<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholars’ Thanksgiving | Attendance</title>
<style>
:root {
  color-scheme: light;
  --bg: linear-gradient(135deg, #f5f8fc, #edf3fd 50%, #d8e6fc);
  --card: #fff; --ink: #162e51; --muted: #4d6382; --line: #d7e4f8;
  --wash: #eaf2fe; --blue: #164eaf; --accent: #174fa8;
  --action: linear-gradient(105deg, #1254d4, #2167db);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: linear-gradient(135deg, #101a2c, #142339 55%, #203956);
  --card: #202730; --ink: #f6efe4; --muted: #c0c9d3; --line: #474e56;
  --wash: #263e59; --blue: #bcd4ec; --accent: #abcfff;
  --action: linear-gradient(105deg, #3c546c, #526d84);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 1rem system-ui, sans-serif; }
main { width: min(100% - 2rem, 64rem); margin: auto; padding: 1rem 0 1.5rem; }
header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; }
.logos { grid-column: 2; display: flex; align-items: center; gap: 1rem; }
.logos span { display: grid; place-items: center; width: 4rem; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: .8rem; font-weight: 650; }
.logos i { height: 2.5rem; border-left: 1px solid var(--line); }
.tools { justify-self: end; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: .5rem; }
.status, button { font: inherit; font-size: .85rem; border-radius: .65rem; padding: .55rem .75rem; }
.status { color: var(--muted); background: var(--wash); }
button { border: 1px solid var(--line); background: var(--card); color: var(--blue); font-weight: 650; cursor: pointer; }
button:disabled { opacity: .65; cursor: default; }
.hero { text-align: center; padding: .8rem 0 1rem; }
h1 { font: 500 clamp(2rem, 6.5vw, 4.65rem)/1.05 Georgia, serif; letter-spacing: -.045em; margin: 0; }
h1 em { color: var(--accent); font-weight: 400; }
.ornament { color: var(--accent); margin-top: .4rem; display: flex; gap: .6rem; align-items: center; justify-content: center; }
.ornament::before, .ornament::after { content: ""; width: 2rem; border-top: 1px solid currentColor; opacity: .45; }
.card { max-width: 40rem; margin: auto; background: var(--card); border: 1px solid var(--line); border-radius: 1.25rem; padding: clamp(1rem, 4vw, 1.35rem); box-shadow: 0 18px 55px #24314214; }
.summary { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding-bottom: .75rem; border-bottom: 1px solid var(--line); }
.count { padding: .1rem 0; }
.summary small { color: var(--muted); display: block; font-size: .78rem; }
.summary strong { display: block; font-size: clamp(1.05rem, 4vw, 1.45rem); font-variant-numeric: tabular-nums; }
.clock { text-align: right; }
#notice:not(:empty) { margin: .65rem 0 0; text-align: center; color: var(--muted); font-size: .85rem; }
#checkin { margin-top: .75rem; }
label { font-weight: 650; display: block; margin-bottom: .4rem; }
input { width: 100%; border: 1px solid var(--line); border-radius: .75rem; background: var(--card); color: var(--ink); padding: .9rem .5rem; font: clamp(1.02rem, 4.5vw, 1.45rem) ui-monospace, monospace; text-align: center; letter-spacing: .08em; }
input::placeholder { color: var(--muted); opacity: 1; }
.primary { margin-top: .75rem; background: var(--action); border: 0; color: #fff; width: 100%; min-height: 2.85rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.welcome:not(:empty) { margin-top: 1rem; padding: .85rem 1rem; background: var(--wash); border: 1px solid var(--line); border-radius: .75rem; color: var(--blue); text-align: center; font-weight: 650; }
@media (max-width: 760px) {
  header { display: flex; flex-direction: column; gap: .5rem; }
  .tools { justify-content: center; }
  .hero { padding-top: .6rem; }
}
.logos span { overflow: hidden; }
.logos img { width: 100%; height: 100%; object-fit: contain; }
button { min-height: 44px; }
</style>
<script src="config.js" defer></script>
<script src="script.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<main>
  <header>
    <div class="logos" aria-label="Event logos"><span><img src="logo1.png" alt="Left event logo" hidden><b>Logo 1</b></span><i aria-hidden="true"></i><span><img src="logo2.png" alt="Right event logo" hidden><b>Logo 2</b></span></div>
    <div class="tools">
      <span class="status" id="status" role="status">Not connected</span>
      <button type="button" id="connect">Connect Google</button>
      <button type="button" id="theme" aria-pressed="false" hidden>Dark mode</button>
    </div>
  </header>
  <div class="hero">
    <h1>Scholars’ <em>Thanksgiving</em></h1>
    <div class="ornament" aria-hidden="true">✦</div>
  </div>
  <section class="card" aria-label="Attendance check-in">
    <div class="summary">
      <div class="count"><small>Total present</small><strong id="count">—</strong></div>
      <div class="clock"><small id="date"></small><strong id="time"></strong></div>
    </div>
    <form id="checkin">
      <label for="student">Student Number</label>
      <input id="student" inputmode="numeric" enterkeyhint="go" autocomplete="off" placeholder="2021-07-00227" pattern="[0-9]{4}-[0-9]{2}-[0-9]{5}" required disabled>
      <button class="primary" id="record" disabled>Record Attendance</button>
    </form>
    <div id="notice" role="status"></div>
    <div class="welcome" id="welcome" role="status"></div>
  </section>
</main>
</body>
</html>
